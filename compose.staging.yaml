# Isolated staging stack pinned to the published Audit Stok candidate images.
# schema-init and API use the same immutable API image; this stack does not
# build from main or mount application data outside its named staging volume.
services:
  db:
    image: postgres:16-alpine
    container_name: kasirv10-staging-db
    restart: unless-stopped
    mem_limit: 576m
    environment:
      POSTGRES_USER: kasirv10_staging
      POSTGRES_PASSWORD: "${KASIRV10_STAGING_DB_PASSWORD:?Isi di .env}"
      POSTGRES_DB: kasirv10_staging
    volumes:
      - staging_db_data:/var/lib/postgresql/data
    networks:
      - kasirv10_staging_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kasirv10_staging -d kasirv10_staging"]
      interval: 5s
      timeout: 5s
      retries: 12

  # Runs the approved legacy staging baseline + Audit migration once; API waits
  # for this service to finish successfully before it can start.
  schema-init:
    image: "ghcr.io/adilacell011-cell/kasirv10-api:candidate-0ed453653af871121d3862988f6eae280969e417-run-42451234988-attempt-1"
    pull_policy: always
    container_name: kasirv10-staging-schema-init
    restart: "no"
    mem_limit: 512m
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DB_RUNTIME_ENV: production
      DATABASE_URL: "postgresql://kasirv10_staging:${KASIRV10_STAGING_DB_PASSWORD:?Isi di .env}@db:5432/kasirv10_staging?schema=public"
      DB_EXPECTED_HOST: db
      DB_EXPECTED_NAME: kasirv10_staging
      DB_EXPECTED_PORT: "5432"
      DB_EXPECTED_SCHEMA: public
      STAGING_SCHEMA_INIT_TARGET: "production:db:5432/kasirv10_staging/public"
    entrypoint: ["node", "--enable-source-maps", "/app/artifacts/api-server/dist/schema-migration-main.mjs"]
    command:
      - --execute
      - --approve=schema-migrate:production:db:5432/kasirv10_staging/public
    networks:
      - kasirv10_staging_net

  api:
    image: "ghcr.io/adilacell011-cell/kasirv10-api:candidate-0ed453653af871121d3862988f6eae280969e417-run-42451234988-attempt-1"
    pull_policy: always
    container_name: kasirv10-staging-api
    restart: unless-stopped
    depends_on:
      schema-init:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      PORT: "8080"
      DB_RUNTIME_ENV: production
      DATABASE_URL: "postgresql://kasirv10_staging:${KASIRV10_STAGING_DB_PASSWORD:?Isi di .env}@db:5432/kasirv10_staging?schema=public"
      DB_EXPECTED_HOST: db
      DB_EXPECTED_NAME: kasirv10_staging
      DB_EXPECTED_PORT: "5432"
      DB_EXPECTED_SCHEMA: public
      STAGING_SCHEMA_INIT_TARGET: "production:db:5432/kasirv10_staging/public"
      STAGING_OWNER_BOOTSTRAP_TARGET: "production:db:5432/kasirv10_staging/public"
      JWT_SECRET: "${KASIRV10_STAGING_JWT_SECRET:?Isi di .env}"
    networks:
      - kasirv10_staging_net
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/api/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s

  web:
    image: "ghcr.io/adilacell011-cell/kasirv10-web:candidate-0ed453653af871121d3862988f6eae280969e417-run-42451234988-attempt-1"
    pull_policy: always
    container_name: kasirv10-staging-web
    restart: unless-stopped
    mem_limit: 96m
    depends_on:
      api:
        condition: service_healthy
    ports:
      # Local-only: access through an SSH tunnel or a separately reviewed proxy.
      # Check this port on the VPS before starting the stack.
      - 127.0.0.1:${KASIRV10_STAGING_WEB_PORT:-18081}:80
    networks:
      - kasirv10_staging_net

  adminer:
    image: adminer:latest
    container_name: kasirv10-staging-adminer
    restart: unless-stopped
    mem_limit: 192m
    command:
      - php
      - -d
      - upload_max_filesize=32M
      - -d
      - post_max_size=32M
      - -d
      - max_execution_time=600
      - -d
      - max_input_time=600
      - -d
      - memory_limit=128M
      - -S
      - 0.0.0.0:8080
      - -t
      - /var/www/html
    depends_on:
      db:
        condition: service_healthy
    environment:
      ADMINER_DEFAULT_SERVER: db
    ports:
      - 127.0.0.1:18082:8080
    networks:
      - kasirv10_staging_net

  # Intentionally profile-gated; the Owner declined backups for current test data.
  backup:
    image: postgres:16-alpine
    container_name: kasirv10-staging-backup
    profiles: ["manual-backup"]
    restart: "no"
    mem_limit: 192m
    user: "0:0"
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGUSER: kasirv10_staging
      PGPASSWORD: ${KASIRV10_STAGING_DB_PASSWORD:?Isi di .env}
      PGDATABASE: kasirv10_staging
      BACKUP_DIR: /backups
      BACKUP_INTERVAL_SECONDS: "${KASIRV10_STAGING_BACKUP_INTERVAL_SECONDS:-21600}"
      BACKUP_KEEP_DAYS: "${KASIRV10_STAGING_BACKUP_KEEP_DAYS:-14}"
    volumes:
      - /srv/kasirv10-staging/backups:/backups
      - ./docker/db-backup.sh:/db-backup.sh:ro
    entrypoint: ["sh", "/db-backup.sh"]
    networks:
      - kasirv10_staging_net

volumes:
  staging_db_data:
    name: kasirv10-staging-db-data

networks:
  kasirv10_staging_net:
    name: kasirv10-staging-net
    driver: bridge
