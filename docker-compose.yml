# Local/self-hosted Docker Compose configuration.
# Copy .env.example to .env and provide every required value before starting.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${POSTGRES_USER:?Set POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}"
      POSTGRES_DB: "${POSTGRES_DB:?Set POSTGRES_DB}"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?Set POSTGRES_USER} -d ${POSTGRES_DB:?Set POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build:
      context: .
      dockerfile: artifacts/api-server/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: "${DATABASE_URL:?Set DATABASE_URL}"
      DB_RUNTIME_ENV: "${DB_RUNTIME_ENV:?Set DB_RUNTIME_ENV=production}"
      DB_EXPECTED_HOST: "${DB_EXPECTED_HOST:?Set DB_EXPECTED_HOST}"
      DB_EXPECTED_NAME: "${DB_EXPECTED_NAME:?Set DB_EXPECTED_NAME to POSTGRES_DB}"
      DB_EXPECTED_PORT: "${DB_EXPECTED_PORT:?Set DB_EXPECTED_PORT}"
      DB_EXPECTED_SCHEMA: "${DB_EXPECTED_SCHEMA:?Set DB_EXPECTED_SCHEMA}"
      PGHOST: db
      PGDATABASE: "${POSTGRES_DB:?Set POSTGRES_DB}"
      PGPORT: 5432
      JWT_SECRET: "${JWT_SECRET:?Set JWT_SECRET}"
      INITIAL_ADMIN_USERNAME: "${INITIAL_ADMIN_USERNAME:-}"
      INITIAL_ADMIN_PASSWORD: "${INITIAL_ADMIN_PASSWORD:-}"
      INITIAL_CASHIER_USERNAME: "${INITIAL_CASHIER_USERNAME:-}"
      INITIAL_CASHIER_PASSWORD: "${INITIAL_CASHIER_PASSWORD:-}"
      PORT: 8080
      NODE_ENV: production

  web:
    build:
      context: .
      dockerfile: artifacts/alfath-pos/Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-8080}:80"

  # Backup files share the host with pgdata. Copy them to a separate off-host
  # destination for disaster recovery. Test restores only on an isolated target.
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    user: "0:0"
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: "${POSTGRES_USER:?Set POSTGRES_USER}"
      PGPASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}"
      PGDATABASE: "${POSTGRES_DB:?Set POSTGRES_DB}"
      BACKUP_INTERVAL_SECONDS: "${BACKUP_INTERVAL_SECONDS:-21600}"
      BACKUP_KEEP_DAYS: "${BACKUP_KEEP_DAYS:-14}"
    volumes:
      - ./backups:/backups
      - ./docker/db-backup.sh:/db-backup.sh:ro
    entrypoint: ["sh", "/db-backup.sh"]

volumes:
  pgdata:
