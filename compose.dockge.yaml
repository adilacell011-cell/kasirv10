# Kasir V10 - Dockge deployment.
# Pulls immutable candidate images; set KASIRV10_IMAGE_SHA to the full SHA
# published by the approved GitHub Actions workflow.
# Provide runtime values in Dockge's environment editor, never commit credentials.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    mem_limit: 576m
    environment:
      POSTGRES_USER: "${POSTGRES_USER:?Set POSTGRES_USER in Dockge}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in Dockge}"
      POSTGRES_DB: "${POSTGRES_DB:?Set POSTGRES_DB in Dockge}"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?Set POSTGRES_USER} -d ${POSTGRES_DB:?Set POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  schema-init:
    image: "ghcr.io/adilacell011-cell/kasirv10-api:sha-${KASIRV10_IMAGE_SHA:?Set the full published candidate SHA}"
    pull_policy: always
    restart: "no"
    mem_limit: 512m
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DB_RUNTIME_ENV: production
      DATABASE_URL: "${DATABASE_URL:?Set DATABASE_URL in Dockge}"
      DB_EXPECTED_HOST: db
      DB_EXPECTED_NAME: "${POSTGRES_DB:?Set POSTGRES_DB in Dockge}"
      DB_EXPECTED_PORT: "5432"
      DB_EXPECTED_SCHEMA: public
      SCHEMA_INIT_AUTO_TARGET: "production:db:5432/${POSTGRES_DB:?Set POSTGRES_DB in Dockge}/public"
    entrypoint: ["node", "--enable-source-maps", "/app/artifacts/api-server/dist/schema-init-main.mjs"]
    command: ["--compose-auto-if-empty"]

  api:
    image: "ghcr.io/adilacell011-cell/kasirv10-api:sha-${KASIRV10_IMAGE_SHA:?Set the full published candidate SHA}"
    pull_policy: always
    restart: unless-stopped
    depends_on:
      schema-init:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: "${DATABASE_URL:?Set DATABASE_URL in Dockge}"
      JWT_SECRET: "${JWT_SECRET:?Set a strong JWT_SECRET in Dockge}"
      DB_RUNTIME_ENV: production
      DB_EXPECTED_HOST: db
      DB_EXPECTED_NAME: "${POSTGRES_DB:?Set POSTGRES_DB in Dockge}"
      DB_EXPECTED_PORT: "5432"
      DB_EXPECTED_SCHEMA: public
      INITIAL_ADMIN_USERNAME: "${INITIAL_ADMIN_USERNAME:-}"
      INITIAL_ADMIN_PASSWORD: "${INITIAL_ADMIN_PASSWORD:-}"
      INITIAL_CASHIER_USERNAME: "${INITIAL_CASHIER_USERNAME:-}"
      INITIAL_CASHIER_PASSWORD: "${INITIAL_CASHIER_PASSWORD:-}"
      PORT: 8080
      NODE_ENV: production

  web:
    image: "ghcr.io/adilacell011-cell/kasirv10-web:sha-${KASIRV10_IMAGE_SHA:?Set the full published candidate SHA}"
    pull_policy: always
    restart: unless-stopped
    mem_limit: 96m
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-8080}:80"

  # Automated database backups are written to ./backups on the host.
  # Keep an additional, off-host copy; the database and this folder share a host.
  # Restore only to an isolated QA database first. Do not pipe a dump into the
  # active production database through this stack.
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    mem_limit: 192m
    user: "0:0"
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: "${POSTGRES_USER:?Set POSTGRES_USER in Dockge}"
      PGPASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in Dockge}"
      PGDATABASE: "${POSTGRES_DB:?Set POSTGRES_DB in Dockge}"
      BACKUP_INTERVAL_SECONDS: "${BACKUP_INTERVAL_SECONDS:-21600}"
      BACKUP_KEEP_DAYS: "${BACKUP_KEEP_DAYS:-14}"
    volumes:
      - ./backups:/backups
      - ./docker/db-backup.sh:/db-backup.sh:ro
    entrypoint: ["sh", "/db-backup.sh"]

volumes:
  pgdata:
