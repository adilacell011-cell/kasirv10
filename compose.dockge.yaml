# AlfathPOS - Dockge deployment.
# Builds from the approved repository; provide runtime values in Dockge's
# environment editor. Never put credentials or personal access tokens in this file.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${POSTGRES_USER:?Set POSTGRES_USER in Dockge}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in Dockge}"
      POSTGRES_DB: "${POSTGRES_DB:?Set POSTGRES_DB in Dockge}"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?Set POSTGRES_USER} -d ${POSTGRES_DB:?Set POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build:
      context: https://github.com/adilacell011-cell/kasirv10.git#main
      dockerfile: artifacts/api-server/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: "${DATABASE_URL:?Set DATABASE_URL in Dockge}"
      JWT_SECRET: "${JWT_SECRET:?Set a strong JWT_SECRET in Dockge}"
      DB_RUNTIME_ENV: "${DB_RUNTIME_ENV:?Set DB_RUNTIME_ENV=production}"
      DB_EXPECTED_HOST: "${DB_EXPECTED_HOST:?Set DB_EXPECTED_HOST}"
      DB_EXPECTED_NAME: "${DB_EXPECTED_NAME:?Set DB_EXPECTED_NAME to POSTGRES_DB}"
      DB_EXPECTED_PORT: "${DB_EXPECTED_PORT:?Set DB_EXPECTED_PORT}"
      DB_EXPECTED_SCHEMA: "${DB_EXPECTED_SCHEMA:?Set DB_EXPECTED_SCHEMA}"
      INITIAL_ADMIN_USERNAME: "${INITIAL_ADMIN_USERNAME:-}"
      INITIAL_ADMIN_PASSWORD: "${INITIAL_ADMIN_PASSWORD:-}"
      INITIAL_CASHIER_USERNAME: "${INITIAL_CASHIER_USERNAME:-}"
      INITIAL_CASHIER_PASSWORD: "${INITIAL_CASHIER_PASSWORD:-}"
      PORT: 8080
      NODE_ENV: production

  web:
    build:
      context: https://github.com/adilacell011-cell/kasirv10.git#main
      dockerfile: artifacts/alfath-pos/Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-8080}:80"

  # Automated database backups are written to ./backups on the host.
  # Keep an additional, off-host copy; the database and this folder share a host.
  # Restore only to an isolated QA database first. Do not pipe a dump into the
  # active production database through this stack.
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    user: "0:0"
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: "${POSTGRES_USER:?Set POSTGRES_USER in Dockge}"
      PGPASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in Dockge}"
      PGDATABASE: "${POSTGRES_DB:?Set POSTGRES_DB in Dockge}"
      BACKUP_INTERVAL_SECONDS: "${BACKUP_INTERVAL_SECONDS:-21600}"
      BACKUP_KEEP_DAYS: "${BACKUP_KEEP_DAYS:-14}"
    volumes:
      - ./backups:/backups
    entrypoint:
      - sh
      - -c
      - |
        set -eu
        INTERVAL="$${BACKUP_INTERVAL_SECONDS:-21600}"
        KEEP_DAYS="$${BACKUP_KEEP_DAYS:-14}"
        BACKUP_DIR="$${BACKUP_DIR:-/backups}"
        case "$$INTERVAL" in ''|*[!0-9]*|0) echo "[backup] invalid BACKUP_INTERVAL_SECONDS" >&2; exit 2 ;; esac
        case "$$KEEP_DAYS" in ''|*[!0-9]*|0) echo "[backup] invalid BACKUP_KEEP_DAYS" >&2; exit 2 ;; esac
        umask 077
        mkdir -p "$$BACKUP_DIR"
        echo "[backup] started; interval=$${INTERVAL}s keep=$${KEEP_DAYS}d target=$${BACKUP_DIR}"
        WORK_DIR=""
        GZIP_PID=""
        cleanup() {
          if [ -n "$$GZIP_PID" ]; then
            kill "$$GZIP_PID" 2>/dev/null || true
            wait "$$GZIP_PID" 2>/dev/null || true
          fi
          if [ -n "$$WORK_DIR" ]; then rm -rf "$$WORK_DIR"; fi
        }
        trap cleanup EXIT
        trap 'exit 129' HUP
        trap 'exit 130' INT
        trap 'exit 143' TERM
        while true; do
          TS="$$(date +%Y%m%d-%H%M%S)"
          FILE="$${BACKUP_DIR}/alfath-$${TS}.sql.gz"
          BACKUP_OK=0
          echo "[backup] $$(date '+%Y-%m-%d %H:%M:%S') dumping -> $${FILE}"
          if ! WORK_DIR="$$(mktemp -d "$${BACKUP_DIR}/.alfath-$${TS}.XXXXXX")"; then
            echo "[backup] FAILED: cannot create temporary directory at $${BACKUP_DIR}" >&2
          else
            FIFO="$${WORK_DIR}/dump.sql"
            TMP="$${WORK_DIR}/backup.sql.gz"
            : > "$$TMP"
            if ! mkfifo "$$FIFO"; then
              echo "[backup] FAILED: cannot create dump pipe at $${TS}" >&2
            else
              gzip -c < "$$FIFO" > "$$TMP" &
              GZIP_PID=$$!
              DUMP_STATUS=0
              if pg_dump --clean --if-exists --no-owner --no-privileges > "$$FIFO"; then
                :
              else
                DUMP_STATUS=$$?
              fi
              GZIP_STATUS=0
              if wait "$$GZIP_PID"; then
                :
              else
                GZIP_STATUS=$$?
              fi
              GZIP_PID=""
              if [ "$$DUMP_STATUS" -eq 0 ] && [ "$$GZIP_STATUS" -eq 0 ] &&
                 [ -s "$$TMP" ] && gzip -t "$$TMP"; then
                if mv "$$TMP" "$$FILE"; then
                  BACKUP_OK=1
                  echo "[backup] ok: $${FILE} ($$(du -h "$$FILE" | cut -f1))"
                else
                  echo "[backup] FAILED: cannot publish completed dump at $${TS}" >&2
                fi
              else
                echo "[backup] FAILED dump/compression/verification at $${TS} (pg_dump=$${DUMP_STATUS}, gzip=$${GZIP_STATUS})" >&2
              fi
            fi
          fi
          if [ -n "$$WORK_DIR" ]; then rm -rf "$$WORK_DIR"; WORK_DIR=""; fi
          if [ "$$BACKUP_OK" -eq 1 ]; then
            if ! find "$$BACKUP_DIR" -name 'alfath-*.sql.gz' -type f \
                -mtime "+$${KEEP_DAYS}" -exec rm -f {} \;; then
              echo "[backup] WARNING: retention cleanup failed" >&2
            fi
          else
            echo "[backup] retention skipped because the new backup failed" >&2
          fi
          sleep "$${INTERVAL}"
        done

volumes:
  pgdata:
