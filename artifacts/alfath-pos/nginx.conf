server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # REST API -> api service (path /api/... is preserved as-is)
  location /api/ {
    proxy_pass http://api:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Realtime (Socket.IO) -> api service, with WebSocket upgrade
  location /socket.io/ {
    proxy_pass http://api:8080;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 86400;
  }

  # Revalidate the app shell and PWA control files after each image update.
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
  }

  location = /sw.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
  }

  location = /registerSW.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
  }

  location = /manifest.webmanifest {
    add_header Cache-Control "no-cache, must-revalidate" always;
  }

  # Vite asset filenames are content-hashed, so immutable caching is safe.
  location ^~ /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  # Single-page app: serve index.html for any unknown path
  location / {
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/ /index.html;
  }
}
