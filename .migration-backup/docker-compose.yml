services:
  app:
    build: .
    container_name: kasir-stb-app
    restart: always
    ports:
      - "3000:3000"
    environment:
      # Connection strings and signing secret are supplied through .env.
      - "DATABASE_URL=${DATABASE_URL:?Set DATABASE_URL in .env}"
      - "DIRECT_URL=${DIRECT_URL:?Set DIRECT_URL in .env}"
      - "JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET in .env}"
      # Mode Environment
      - NODE_ENV=production
