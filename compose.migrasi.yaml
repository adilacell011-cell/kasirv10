# Separate Kasir V10 app using the existing VPS PostgreSQL server.
# Database kasirv10_migrasi already exists on kasirv10-staging-db and contains
# the restored STB data. This stack intentionally does not create or migrate a DB.

services:
  api:
    image: "ghcr.io/adilacell011-cell/kasirv10-api:candidate-1e720bb8eacedd267213b5424730c79e79c44c37-run-42751323108-attempt-1"
    pull_policy: always
    container_name: kasirv10-migrasi-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "8080"
      DB_RUNTIME_ENV: production
      DATABASE_URL: "postgresql://kasirv10_staging:${KASIRV10_STAGING_DB_PASSWORD:?Set KASIRV10_STAGING_DB_PASSWORD in .env}@kasirv10-staging-db:5432/kasirv10_migrasi?schema=public"
      DB_EXPECTED_HOST: kasirv10-staging-db
      DB_EXPECTED_NAME: kasirv10_migrasi
      DB_EXPECTED_PORT: "5432"
      DB_EXPECTED_SCHEMA: public
      JWT_SECRET: "${KASIRV10_MIGRASI_JWT_SECRET:?Set a separate KASIRV10_MIGRASI_JWT_SECRET in .env}"
    networks:
      - kasirv10_staging_net
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/api/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s

  web:
    image: "ghcr.io/adilacell011-cell/kasirv10-web:candidate-1e720bb8eacedd267213b5424730c79e79c44c37-run-42751323108-attempt-1"
    pull_policy: always
    container_name: kasirv10-migrasi-web
    restart: unless-stopped
    mem_limit: 96m
    depends_on:
      api:
        condition: service_healthy
    ports:
      # Local-only; expose through the VPS proxy after reviewing its routing.
      - "127.0.0.1:${KASIRV10_MIGRASI_WEB_PORT:-18083}:80"
    networks:
      - kasirv10_staging_net

networks:
  kasirv10_staging_net:
    external: true
    name: kasirv10-staging-net
