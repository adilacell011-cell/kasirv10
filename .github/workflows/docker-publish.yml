name: Build and publish Docker images

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_validated_candidate:
        description: Publish the validated Kasir V10 candidate SHA from the validation branch
        required: true
        type: boolean
        default: false
      candidate_source_sha:
        description: Exact source SHA for the clean stock-audit candidate
        required: false
        type: string
      verify_existing_candidate:
        description: Verify the already-published stock-audit candidate without building or publishing
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    # Main keeps its existing release flow. Validation-branch publication is
    # manual, explicitly confirmed, and pinned to the previously validated SHA.
    if: >-
      github.ref == 'refs/heads/main' ||
      (github.event_name == 'workflow_dispatch' &&
       (github.ref == 'refs/heads/validate/multiplatform-arm64' ||
        github.ref == 'refs/heads/validate/stock-audit-camera' ||
        github.ref == 'refs/heads/validate/stock-audit-camera-clean') &&
       inputs.publish_validated_candidate == true)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            dockerfile: artifacts/api-server/Dockerfile
          - name: web
            dockerfile: artifacts/alfath-pos/Dockerfile
    steps:
      - name: Select authorized source commit
        id: source
        env:
          CONFIRM_CANDIDATE_PUBLISH: ${{ inputs.publish_validated_candidate }}
          CANDIDATE_SOURCE_SHA: ${{ inputs.candidate_source_sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "adilacell011-cell/kasirv10"
          source_sha="$GITHUB_SHA"
          tag_mode="sha"
          if [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
            publish_latest=true
          elif [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" &&
                  "$GITHUB_REF" == "refs/heads/validate/stock-audit-camera-clean" ]]; then
            if [[ "$CONFIRM_CANDIDATE_PUBLISH" != "true" ]]; then
              echo "Candidate publication requires explicit confirmation."
              exit 1
            fi
            if [[ "$CANDIDATE_SOURCE_SHA" != "e699ba766c97b0c7dda35dc87cc231f3eff63e78" ]]; then
              echo "Refusing to publish: source SHA does not match the approved clean stock-audit candidate."
              exit 1
            fi
            source_sha="$CANDIDATE_SOURCE_SHA"
            publish_latest=false
            tag_mode="candidate"
          elif [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" &&
                  ( "$GITHUB_REF" == "refs/heads/validate/multiplatform-arm64" ||
                    "$GITHUB_REF" == "refs/heads/validate/stock-audit-camera" ) ]]; then
            if [[ "$CONFIRM_CANDIDATE_PUBLISH" != "true" ]]; then
              echo "Candidate publication requires explicit confirmation."
              exit 1
            fi
            publish_latest=false
          else
            echo "Refusing to publish from an unauthorized branch or event."
            exit 1
          fi
          if [[ ! "$source_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Workflow event did not provide a full commit SHA."
            exit 1
          fi
          echo "sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "publish_latest=$publish_latest" >> "$GITHUB_OUTPUT"
          echo "tag_mode=$tag_mode" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.sha }}
      - name: Verify pinned source is reachable from the clean candidate branch
        if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/validate/stock-audit-camera-clean' }}
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          if [[ "$(git rev-parse --is-shallow-repository)" == "true" ]]; then
            git fetch --no-tags --unshallow origin refs/heads/validate/stock-audit-camera-clean
          else
            git fetch --no-tags origin refs/heads/validate/stock-audit-camera-clean
          fi
          git merge-base --is-ancestor "$SOURCE_SHA" FETCH_HEAD
          echo "Pinned source commit is part of the selected branch history."
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute image name and tags
        id: img
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          PUBLISH_LATEST: ${{ steps.source.outputs.publish_latest }}
          TAG_MODE: ${{ steps.source.outputs.tag_mode }}
        run: |
          set -euo pipefail
          image="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')-${{ matrix.name }}"
          if [[ "$TAG_MODE" == "candidate" ]]; then
            image_tag="candidate-${SOURCE_SHA}-run-${GITHUB_RUN_ID}-attempt-${GITHUB_RUN_ATTEMPT}"
          else
            image_tag="sha-${SOURCE_SHA}"
          fi
          {
            echo "name=$image"
            echo "tag_value=$image_tag"
            echo "tags<<EOF"
            echo "$image:$image_tag"
            if [[ "$PUBLISH_LATEST" == "true" ]]; then
              echo "$image:latest"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "Image: $image"
          echo "Source tag: $image_tag"
          if [[ "$PUBLISH_LATEST" == "true" ]]; then echo "Main release also updates latest."; fi
      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.img.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify published multi-platform manifest
        env:
          IMAGE: ${{ steps.img.outputs.name }}
          IMAGE_TAG: ${{ steps.img.outputs.tag_value }}
          IMAGE_DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          if ! docker buildx imagetools inspect --raw "${IMAGE}:${IMAGE_TAG}" \
            > /tmp/manifest.json 2> /tmp/manifest-inspect.err; then
            echo "Could not read the published registry manifest for ${IMAGE}:${IMAGE_TAG}." >&2
            cat /tmp/manifest-inspect.err >&2
            exit 1
          fi

          if ! inspect_output="$(docker buildx imagetools inspect "${IMAGE}:${IMAGE_TAG}" \
            2> /tmp/manifest-summary.err)"; then
            echo "Could not inspect the published registry digest for ${IMAGE}:${IMAGE_TAG}." >&2
            cat /tmp/manifest-summary.err >&2
            exit 1
          fi
          published_digest="$(printf '%s\n' "$inspect_output" | awk '$1 == "Digest:" { print $2; exit }')"
          if [[ -z "$IMAGE_DIGEST" ]]; then
            echo "Build action did not return the published manifest digest." >&2
            exit 1
          fi
          if [[ -z "$published_digest" ]]; then
            echo "Could not read the published registry digest from the inspect output." >&2
            exit 1
          fi
          if [[ "$published_digest" != "$IMAGE_DIGEST" ]]; then
            echo "Published digest does not match the build result." >&2
            echo "Build: $IMAGE_DIGEST; registry: $published_digest" >&2
            exit 1
          fi
          node <<'NODE'
          const fs = require("node:fs");
          const manifest = JSON.parse(fs.readFileSync("/tmp/manifest.json", "utf8"));
          const summaries = (manifest.manifests || []).map((item) => ({
            mediaType: item.mediaType || null,
            digest: item.digest || null,
            size: item.size ?? null,
            os: item.platform?.os || null,
            architecture: item.platform?.architecture || null,
            variant: item.platform?.variant || null,
          }));
          console.log("Published manifest descriptors:");
          console.log(JSON.stringify(summaries, null, 2));
          const platforms = new Set(summaries.map((item) => `${item.os}/${item.architecture}`));
          for (const expected of ["linux/amd64", "linux/arm64"]) {
            if (!platforms.has(expected)) {
              console.error(`Missing ${expected} in published image manifest`);
              process.exit(1);
            }
          }
          console.log(`Image: ${process.env.IMAGE}:${process.env.IMAGE_TAG}`);
          console.log(`Digest: ${process.env.IMAGE_DIGEST}`);
          console.log("Published manifest includes linux/amd64 and linux/arm64.");
          NODE

  verify-published-candidate:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/validate/stock-audit-camera-clean' && inputs.verify_existing_candidate == true }}
    runs-on: ubuntu-latest
    permissions:
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            expected_digest: sha256:c5a185d10f5d9330b01fc7dc5a24150ee87c76b2504d887387a004b1853d85f2
          - name: web
            expected_digest: sha256:40a990158e92ecd1e6c8d1a5b85d4207ad4327258559f16c84f289efddb3957c
    steps:
      - name: Verify approved source and registry targets
        env:
          SOURCE_SHA: ${{ inputs.candidate_source_sha }}
        run: |
          set -euo pipefail
          if [[ "$SOURCE_SHA" != "1f45011808afa79437629758d5fcb25332b900f0" ]]; then
            echo "Refusing verification: source SHA does not match the approved candidate."
            exit 1
          fi
          echo "Source SHA: $SOURCE_SHA"
          echo "Registry tag is pinned to publish run 42211464440, attempt 1."
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify published digest and platform manifest
        env:
          IMAGE: ghcr.io/adilacell011-cell/kasirv10-${{ matrix.name }}
          IMAGE_TAG: candidate-1f45011808afa79437629758d5fcb25332b900f0-run-42211464440-attempt-1
          EXPECTED_DIGEST: ${{ matrix.expected_digest }}
        run: |
          set -euo pipefail
          if ! docker buildx imagetools inspect --raw "${IMAGE}:${IMAGE_TAG}" \
            > /tmp/manifest.json 2> /tmp/manifest-inspect.err; then
            echo "Could not read the published registry manifest for ${IMAGE}:${IMAGE_TAG}." >&2
            cat /tmp/manifest-inspect.err >&2
            exit 1
          fi
          if ! inspect_output="$(docker buildx imagetools inspect "${IMAGE}:${IMAGE_TAG}" \
            2> /tmp/manifest-summary.err)"; then
            echo "Could not inspect the published registry digest for ${IMAGE}:${IMAGE_TAG}." >&2
            cat /tmp/manifest-summary.err >&2
            exit 1
          fi
          published_digest="$(printf '%s\n' "$inspect_output" | awk '$1 == "Digest:" { print $2; exit }')"
          if [[ -z "$EXPECTED_DIGEST" || "$published_digest" != "$EXPECTED_DIGEST" ]]; then
            echo "Published digest did not match the recorded build digest." >&2
            echo "Expected: $EXPECTED_DIGEST; registry: ${published_digest:-missing}" >&2
            exit 1
          fi
          node <<'NODE'
          const fs = require("node:fs");
          const manifest = JSON.parse(fs.readFileSync("/tmp/manifest.json", "utf8"));
          const descriptors = (manifest.manifests || []).map((item) => ({
            mediaType: item.mediaType || null,
            digest: item.digest || null,
            size: item.size ?? null,
            os: item.platform?.os || null,
            architecture: item.platform?.architecture || null,
            variant: item.platform?.variant || null,
          }));
          console.log(`Image: ${process.env.IMAGE}:${process.env.IMAGE_TAG}`);
          console.log(`Digest: ${process.env.EXPECTED_DIGEST}`);
          console.log("Manifest descriptors:");
          console.log(JSON.stringify(descriptors, null, 2));
          const platforms = new Set(descriptors.map((item) => `${item.os}/${item.architecture}`));
          for (const expected of ["linux/amd64", "linux/arm64"]) {
            if (!platforms.has(expected)) {
              console.error(`Missing ${expected} in published image manifest`);
              process.exit(1);
            }
          }
          console.log("Published manifest includes linux/amd64 and linux/arm64.");
          NODE
