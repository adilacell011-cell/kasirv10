name: Build and publish Docker images

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build:
    # Never publish images from validation or feature branches, including a
    # manually dispatched workflow run using a non-main ref.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            dockerfile: artifacts/api-server/Dockerfile
          - name: web
            dockerfile: artifacts/alfath-pos/Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute lowercase image name
        id: img
        run: echo "name=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')-${{ matrix.name }}" >> "$GITHUB_OUTPUT"
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.img.outputs.name }}:latest
            ${{ steps.img.outputs.name }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify published multi-platform manifest
        env:
          IMAGE: ${{ steps.img.outputs.name }}
          IMAGE_TAG: sha-${{ github.sha }}
        run: |
          set -euo pipefail
          docker buildx imagetools inspect --raw "${IMAGE}:${IMAGE_TAG}" > /tmp/manifest.json
          node -e '
            const fs = require("node:fs");
            const manifest = JSON.parse(fs.readFileSync("/tmp/manifest.json", "utf8"));
            const platforms = new Set((manifest.manifests || []).map((item) =>
              `${item.platform?.os}/${item.platform?.architecture}`
            ));
            for (const expected of ["linux/amd64", "linux/arm64"]) {
              if (!platforms.has(expected)) {
                console.error(`Missing ${expected} in published image manifest`);
                process.exit(1);
              }
            }
            console.log("Published image manifest includes linux/amd64 and linux/arm64.");
          '
