name: Validate multi-platform Docker images

on:
  push:
    branches: [validate/multiplatform-arm64]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
            dockerfile: artifacts/api-server/Dockerfile
          - image: web
            dockerfile: artifacts/alfath-pos/Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build both platforms without publishing
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: false
          outputs: type=oci,dest=/tmp/kasirv10-${{ matrix.image }}.tar

      - name: Verify local OCI manifest
        env:
          OCI_ARCHIVE: /tmp/kasirv10-${{ matrix.image }}.tar
        run: |
          set -euo pipefail
          node -e '
            const { execFileSync } = require("node:child_process");
            const index = JSON.parse(execFileSync(
              "tar",
              ["-xOf", process.env.OCI_ARCHIVE, "index.json"],
              { encoding: "utf8" }
            ));
            const platforms = new Set((index.manifests || []).map((item) =>
              `${item.platform?.os}/${item.platform?.architecture}`
            ));
            for (const expected of ["linux/amd64", "linux/arm64"]) {
              if (!platforms.has(expected)) {
                console.error(`Missing ${expected} in local OCI image manifest`);
                process.exit(1);
              }
            }
            console.log("Local OCI manifest includes linux/amd64 and linux/arm64.");
          '

      - name: Save OCI archive for Owner review
        uses: actions/upload-artifact@v4
        with:
          name: kasirv10-${{ matrix.image }}-oci-${{ github.sha }}
          path: /tmp/kasirv10-${{ matrix.image }}.tar
          if-no-files-found: error
          retention-days: 7
